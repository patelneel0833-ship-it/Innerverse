<style>
:root{--tx:#F4F1FF;--mu:#9B97B5;--a:#7C5CFF;--b:#26D7C0;--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#07070D;color:var(--tx);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%}
#view{position:fixed;inset:0;overflow:auto;padding:max(22px,env(safe-area-inset-top)) 20px 120px;-webkit-overflow-scrolling:touch}
#view>*{max-width:680px;margin:0 auto;animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
body[data-view=sky] #view{pointer-events:none;overflow:hidden}body[data-view=sky] #view>*>*{pointer-events:auto}
h1,h2{font:300 clamp(32px,7vw,50px)/1.1 Newsreader,Georgia,serif;margin:4px 0 10px;letter-spacing:-.01em}
h2{font-size:24px}.mu{color:var(--mu)}.sm{font-size:13px}
.glass{background:rgba(24,20,48,.72);border:1px solid var(--bd);border-radius:20px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{padding:8px 14px;border-radius:16px;background:var(--gl);border:1px solid var(--bd);text-align:right;font-weight:600;white-space:nowrap}.pill small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.hint{text-align:center;margin-top:30px}
.empty{text-align:center;margin-top:24vh}
.cta{padding:14px 26px;border-radius:999px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:600;box-shadow:0 0 40px -6px var(--a);animation:pulse 3s infinite}
@keyframes pulse{50%{box-shadow:0 0 56px 0 var(--a)}}
.card{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,520px);padding:18px;animation:in .35s}
.card h3{font:300 24px Newsreader,serif;margin:2px 0}

 const xy=ev=>{const r=sv.getBoundingClientRect(),k=240/r.width;return[(ev.clientX-r.left)*k,(ev.clientY-r.top)*k]};
 const hit=p=>{for(let i=0;i<9;i++){const c=C(i);if(Math.hypot(p[0]-c[0],p[1]-c[1])<30)return i}return -1};
 const draw=()=>{const pts=path.map(C);if(on&&pt)pts.push(pt);pl.setAttribute("points",pts.map(p=>p.join(",")).join(" "));dc.forEach((d,i)=>{const o=path.includes(i);d.classList.toggle("on",o);dh[i].classList.toggle("on",o)})};
 const add=i=>{if(path.includes(i))return;if(path.length){const a=path[path.length-1],ar=(a/3)|0,ac=a%3,br=(i/3)|0,bc=i%3;if((ar+br)%2===0&&(ac+bc)%2===0){const m=((ar+br)/2)*3+(ac+bc)/2;if(!path.includes(m))path.push(m)}}path.push(i)};
 const reset=()=>{path=[];on=false;pt=null;busy=false;host.classList.remove("bad");draw()};
 host.addEventListener("pointerdown",ev=>{if(busy)return;ev.preventDefault();path=[];on=true;host.classList.remove("bad");try{host.setPointerCapture(ev.pointerId)}catch(e){}pt=xy(ev);const h=hit(pt);if(h>=0)add(h);draw()});
 host.addEventListener("pointermove",ev=>{if(!on)return;pt=xy(ev);const h=hit(pt);if(h>=0)add(h);draw()});
 const end=()=>{if(!on)return;on=false;pt=null;draw();if(!path.length)return;busy=true;const p=path.join(""),n=path.length;done(p,n);setTimeout(reset,600)};
 host.addEventListener("pointerup",end);host.addEventListener("pointercancel",end);
 host.addEventListener("contextmenu",ev=>ev.preventDefault());
 return{reset,flash:()=>host.classList.add("bad")}}
let lmode="enter",ptmp="",pad;
function setLm(m){lmode=m;const lg=m==="legacy";$("#lm").textContent={enter:"Draw your pattern to open your universe.",legacy:"We’re switching to a pattern lock. Enter your old password one last time.",new1:"Draw a pattern to protect your diary. Connect at least 4 dots.",new2:"Draw it once more to confirm."}[m];$("#p1").hidden=!lg;$("#lb2").hidden=!lg;$("#pad").hidden=lg;$("#lfid").hidden=!(m==="enter"&&faceId())}
function setupLock(){setLm(getPat()?"enter":getPw()?"legacy":"new1");ptmp="";$("#p1").value=$("#le").textContent="";locked=true;document.body.classList.add("lk");$("#lock").style.display="flex";if(pad)pad.reset();if(lmode==="legacy")setTimeout(()=>$("#p1").focus(),50)}
function lockNow(){if(locked)return;commit();vaultOk=false;const g=$("#vg");if(g)g.remove();clearTimeout(it);view="sky";cur=null;$("#view").innerHTML="";document.querySelectorAll("#lb").forEach(n=>n.remove());setupLock()}
function patAsk(title,sub){return new Promise(res=>{const old=$("#vg");if(old)old.remove();const el=document.createElement("div");el.id="vg";el.innerHTML=`<div class="glass vgc" role="dialog" aria-label="${title}"><h2>${title}</h2><p class="mu sm" style="margin:0">${sub}</p><div id="vpad"></div><p class="sm" id="vge" role="alert" style="color:#FF8A75;min-height:1.3em;margin:6px 0 0"></p><div class="vgb"><button class="ch" id="vgx" type="button">Cancel</button></div></div>`;document.body.appendChild(el);const fin=v=>{el.remove();res(v)};const p=mkPad($("#vpad"),(pat,n)=>{if(n<4){$("#vge").textContent="Connect at least 4 dots.";p.flash();return}fin(pat)});$("#vgx").onclick=()=>fin(null)})}
async function chPw(){const m=$("#pm"),say=t=>{if(m)m.textContent=t};say("");
 const c=await patAsk("Current pattern","Draw your current pattern.");if(!c)return;
 const st=getPat();if(!st||await hashPw(c,unb(st.s))!==st.h){say("Current pattern is wrong.");return}
 const a=await patAsk("New pattern","Draw a new pattern. At least 4 dots.");if(!a)return;
 const b=await patAsk("Confirm pattern","Draw it once more.");if(!b)return;
 if(a!==b){say("The patterns didn’t match.");return}
 try{await savePat(a);say("Pattern changed.")}catch(x){say("Couldn’t save the pattern in this browser.")}}
const bad=t=>{$("#le").textContent=t;pad.flash()};
async function onPat(pat,n){$("#le").textContent="";
 if(n<4){bad("Connect at least 4 dots.");return}
 if(lmode==="enter"){if(Date.now()<until){bad("Too many attempts. Try again in "+Math.ceil((until-Date.now())/1000)+" seconds.");return}
  const st=getPat();if(st&&await hashPw(pat,unb(st.s))===st.h)unlockOk();else{fails++;bad("Wrong pattern.");if(fails>=5){until=Date.now()+30000;fails=0}}}
 else if(lmode==="new1"){ptmp=pat;setLm("new2")}
 else if(lmode==="new2"){if(pat!==ptmp){ptmp="";setLm("new1");bad("Patterns didn’t match. Start again.");return}
  try{await savePat(pat)}catch(x){bad("Couldn’t save the pattern in this browser.");return}
  try{localStorage.removeItem(PK)}catch(x){}unlockOk()}}
pad=mkPad($("#pad"),onPat);
$("#lf").addEventListener("submit",async ev=>{ev.preventDefault();if(lmode!=="legacy")return;const e=$("#le"),st=getPw();
 if(Date.now()<until){e.textContent="Too many attempts. Try again in "+Math.ceil((until-Date.now())/1000)+" seconds.";return}
 if(st&&await hashPw($("#p1").value,unb(st.s))===st.h){$("#p1").value="";e.textContent="";setLm("new1")}else{fails++;$("#p1").value="";e.textContent="Wrong password.";if(fails>=5){until=Date.now()+30000;fails=0}}});
$("#lfid").addEventListener("click",async()=>{const e=$("#le");try{if(await faceCheck())unlockOk();else e.textContent="Face ID didn’t match. Use your pattern."}catch(x){e.textContent="Face ID cancelled. Use your pattern."}});
function idle(){clearTimeout(it);it=setTimeout(lockNow,300000)}
["pointerdown","keydown","scroll"].forEach(e=>addEventListener(e,idle,{passive:true}));
addEventListener("error",e=>toast("Error: "+(e.message||"unknown")));applyWorld();size();let lastF=0;const frame=t=>{lastF=performance.now();try{draw(t)}catch(e){}requestAnimationFrame(frame)};requestAnimationFrame(frame);setInterval(()=>{if(performance.now()-lastF>250){lastF=performance.now();try{draw(performance.now())}catch(e){}}},100);setupLock();
</script></body></html>
